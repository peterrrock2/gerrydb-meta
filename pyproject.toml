[project]
name = "gerrydb-meta"
version = "0.2.0"
description = ""
requires-python = ">=3.11"
authors = [{ name = "MGGG", email = "code@mggg.org" }]

dependencies = [
  "SQLAlchemy>=2.0.4,<3.0.0",
  "pydantic>=2.11.7,<3.0.0",
  "GeoAlchemy2>=0.17.1,<1.0.0",
  "psycopg2-binary>=2.9.3,<3.0.0",
  "click>=8.1.3,<9.0.0",
  "PyYAML>=6.0,<7.0",
  "utm>=0.8.1,<1.0.0",
  "fastapi>=0.115.14,<1.0.0",
  "uvicorn>=0.35.0,<1.0.0",
  "httpx>=0.28.1,<1.0.0",
  "ormsgpack>=1.2.5,<2.0.0",
  "gunicorn>=23.0.0,<24.0.0",
  "shapely>=2.0.1,<3.0.0",
  "orjson>=3.8.10,<4.0.0",
  "google-cloud-storage>=3.1.1,<4.0.0",
  "google-auth>=2.40.3,<3.0.0",
  "networkx>=3.5.0,<4.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.1,<9.0.0",
  "black>=25.1.0,<26.0.0",
  "isort>=6.0.1,<7.0.0",
  "alembic>=1.16.2,<2.0.0",
  "geopandas>=1.1.1,<2.0.0",
  "fiona>=1.10.1,<2.0.0",
  "pytest-cov>=6.2.1,<7.0.0",
  "pytest-asyncio>=1.0.0,<2.0.0",
  "pytest-httpx>=0.35.0,<1.0.0",
  "sqltap>=0.3.11,<1.0.0",
  "msgpack>=1.1.1,<2.0.0",
]

[tool.isort]
profile = "black"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

