version: "3.9"
services:
  db:
    platform: linux/amd64
    # Pinned to the live cluster's major: an unpinned pull that bumps the major
    # will refuse to start on the persistent volume.
    image: postgis/postgis:17-3.5
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    ports:
      - "54320:5432"
    environment:
      POSTGRES_PASSWORD: dev
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./postgres.conf:/etc/postgresql/postgresql.conf:ro
    deploy:
      # Do not touch the memory limits or TX will destroy you
      resources:
        limits:
          memory: 16g
        reservations:
          memory: 8g
    shm_size: "16gb"

  test-db:
    platform: linux/amd64
    image: postgis/postgis:17-3.5
    # Shares the tuned config (which includes the raised max_locks_per_transaction
    # the test suite's DROP SCHEMA ... CASCADE needs).
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    ports:
      - "54321:5432"
    environment:
      POSTGRES_PASSWORD: test
    volumes:
      - test_db_data:/var/lib/postgresql/data
      - ./postgres.conf:/etc/postgresql/postgresql.conf:ro
    deploy:
      resources:
        limits:
          memory: 16g
        reservations:
          memory: 8g
    shm_size: "16gb"

volumes:
  db_data:
    external: true
    name: db_data
  test_db_data:
    external: false
