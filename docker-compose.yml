version: "3.9"
services:
  db:
    platform: linux/amd64
    image: postgis/postgis
    ports:
      - "54320:5432"
    environment:
      POSTGRES_PASSWORD: dev
    volumes:
      - db_data:/var/lib/postgresql/data
    deploy:
      # Do not touch the memory limits or TX will destroy you
      resources:
        limits:
          memory: 16g
        reservations:
          memory: 8g
    shm_size: "16gb"

  test-db:
    platform: linux/amd64
    image: postgis/postgis
    # Test suites drop/recreate the whole schema constantly; the default lock
    # table is marginal for DROP SCHEMA ... CASCADE under concurrent load.
    command: postgres -c max_locks_per_transaction=256
    ports:
      - "54321:5432"
    environment:
      POSTGRES_PASSWORD: test
    volumes:
      - test_db_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 16g
        reservations:
          memory: 8g
    shm_size: "16gb"

volumes:
  db_data:
    external: true
    name: db_data
  test_db_data:
    external: false
