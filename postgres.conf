# GerryDB Postgres tuning. Sized for the 16 GB containers in this
# directory's docker-compose.yml; GerryDB_Local_Speed_Tester carries a
# proportional 8 GB copy.
#
# Mounted via: command: postgres -c config_file=/etc/postgresql/postgresql.conf
# This replaces the entire default config, so listen_addresses must be set here
# (the image's initdb-time append to the data-dir config no longer applies).
listen_addresses = '*'
max_connections = 100

shared_buffers = 4GB
effective_cache_size = 12GB
# Per sort/hash node per backend; the API serves from ~40 pooled connections
# max (4 workers x pool 10), so watch RSS before raising further.
work_mem = 256MB
maintenance_work_mem = 2GB
max_wal_size = 8GB
random_page_cost = 1.1
max_parallel_workers_per_gather = 4

shared_preload_libraries = 'pg_stat_statements'

# 692 column_value partitions: partition-wide plans and the test suite's
# DROP SCHEMA ... CASCADE exhaust the default lock table.
max_locks_per_transaction = 256

# Renders read ogr2ogr cursors to completion; the default fast-start cursor
# planning (fraction 0.1) picked quadratic plans for the pivot queries.
cursor_tuple_fraction = 1.0
